  <script>
    /* ================= 全局状态 ================= */
    let topLevelData = null;
    let currentPage = 'home';        // 'home' | 'detail' | 'search'
    let sectionObserver = null;
    const PREVIEW_LIMIT = 18;

    const CATEGORY_ICONS = {
      '搜索工具': '🔍', '实用工具': '🛠️', '设计素材': '🎨', 'AI工具库': '🤖',
      '软件平台': '💻', '编程开发': '⌨️', '网站导航': '🧭', '内容资讯': '📰', '趣味网站': '🎮'
    };

    /* ================= 数据工具函数 ================= */
    // 递归收集文件夹下所有层级的链接
    function collectLinks(folder) {
      const links = [];
      for (const child of folder.children || []) {
        if (child.type === 'link') links.push(child);
        else if (child.type === 'folder') links.push(...collectLinks(child));
      }
      return links;
    }

    function subFolders(folder) {
      return (folder.children || []).filter(c => c.type === 'folder');
    }

    /* ================= 卡片组件 ================= */
    function createSiteCard(link) {
      const card = document.createElement('a');
      card.href = link.url;
      card.target = '_blank';
      card.rel = 'noopener';
      card.className = 'mn-card';
      if (link.description) card.title = link.description;

      const icon = document.createElement('img');
      icon.src = link.icon || 'assets/default-icon.svg';
      icon.alt = link.title;
      icon.loading = 'lazy';
      icon.decoding = 'async';
      icon.className = 'mn-card-icon';
      icon.onerror = () => { icon.src = 'assets/default-icon.svg'; };

      const content = document.createElement('div');
      content.className = 'mn-card-content';

      const title = document.createElement('div');
      title.className = 'mn-card-title';
      title.innerText = link.title;

      content.appendChild(title);
      if (link.description) {
        const desc = document.createElement('p');
        desc.className = 'mn-card-desc';
        desc.innerText = link.description;
        content.appendChild(desc);
      }

      card.appendChild(icon);
      card.appendChild(content);
      return card;
    }

    /* ================= 侧边栏（首页 + 一级分类锚点） ================= */
    function buildSidebarNav() {
      const buildList = (ul) => {
        ul.innerHTML = '';

        // 首页
        const homeItem = document.createElement('li');
        homeItem.className = 'mn-nav-item';
        homeItem.dataset.index = '-1';
        homeItem.innerHTML = '<span class="mn-nav-icon">🏠</span><span class="mn-nav-text">首页</span>';
        homeItem.onclick = () => { closeMobileMenu(); goHome(); };
        ul.appendChild(homeItem);

        // 一级分类
        topLevelData.forEach((cat, i) => {
          const item = document.createElement('li');
          item.className = 'mn-nav-item';
          item.dataset.index = String(i);
          const iconChar = CATEGORY_ICONS[cat.title] || '📁';
          item.innerHTML = `<span class="mn-nav-icon">${iconChar}</span><span class="mn-nav-text"></span>`;
          item.querySelector('.mn-nav-text').innerText = cat.title;
          item.onclick = () => { closeMobileMenu(); goToCategory(i); };
          ul.appendChild(item);
        });
      };

      buildList(document.getElementById('navigation'));
      buildList(document.getElementById('navigation-mobile'));
    }

    function highlightNav(index) {
      document.querySelectorAll('.mn-nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.index === String(index));
      });
    }

    function goHome() {
      if (currentPage !== 'home') {
        renderHome();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      highlightNav(-1);
    }

    function goToCategory(index) {
      if (currentPage !== 'home') renderHome();
      const section = document.getElementById('cat-' + index);
      if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      highlightNav(index);
    }

    function closeMobileMenu() {
      // 若移动端菜单处于打开状态则关闭（closeSidebar 定义于下方菜单逻辑中）
      if (typeof closeSidebar === 'function') closeSidebar();
    }

    /* ================= 首页：分类区块平铺 ================= */
    function renderHome() {
      currentPage = 'home';
      const container = document.getElementById('bookmarks');
      container.innerHTML = '';
      document.getElementById('breadcrumbs').style.display = 'none';
      document.getElementById('back-home-button').classList.add('hidden');
      document.getElementById('clearSearchButton').classList.add('hidden');
      document.getElementById('clearSearchButtonMobile').classList.add('hidden');

      topLevelData.forEach((cat, i) => {
        container.appendChild(buildCategorySection(cat, i));
      });

      initSectionObserver();
    }

    function buildCategorySection(cat, index) {
      const section = document.createElement('section');
      section.className = 'mn-section';
      section.id = 'cat-' + index;

      // 状态：当前选中的二级 / 三级标签
      const state = { activeTag: null, activeSub: null };

      // ---- 标题 ----
      const header = document.createElement('div');
      header.className = 'mn-section-header';
      const iconChar = CATEGORY_ICONS[cat.title] || '📁';
      header.innerHTML = `<span class="mn-section-icon">${iconChar}</span><h2 class="mn-section-title"></h2>
        <span class="mn-section-count">${collectLinks(cat).length}</span>`;
      header.querySelector('.mn-section-title').innerText = cat.title;
      section.appendChild(header);

      // ---- 二级标签行 + 查看更多 ----
      const tagsRow = document.createElement('div');
      tagsRow.className = 'mn-tags-row';

      const tagsBox = document.createElement('div');
      tagsBox.className = 'mn-tags';
      tagsRow.appendChild(tagsBox);

      const viewMore = document.createElement('button');
      viewMore.className = 'mn-view-more';
      viewMore.innerHTML = '查看更多 <span aria-hidden="true">→</span>';
      viewMore.onclick = () => {
        const path = [cat];
        if (state.activeTag) path.push(state.activeTag);
        if (state.activeSub) path.push(state.activeSub);
        showDetail(path);
      };
      tagsRow.appendChild(viewMore);
      section.appendChild(tagsRow);

      // ---- 三级联动标签行 ----
      const subRow = document.createElement('div');
      subRow.className = 'mn-subtags-row';
      const subTagsBox = document.createElement('div');
      subTagsBox.className = 'mn-tags';
      subRow.appendChild(subTagsBox);
      section.appendChild(subRow);

      // ---- 卡片网格 ----
      const grid = document.createElement('div');
      grid.className = 'mn-grid';
      section.appendChild(grid);

      // 渲染当前筛选范围的卡片（前 18 条）
      function currentLinks() {
        if (state.activeSub) return collectLinks(state.activeSub);
        if (state.activeTag) return collectLinks(state.activeTag);
        return collectLinks(cat);
      }

      function renderGrid() {
        const links = currentLinks();
        grid.innerHTML = '';
        links.slice(0, PREVIEW_LIMIT).forEach(l => grid.appendChild(createSiteCard(l)));
        viewMore.style.display = links.length > PREVIEW_LIMIT ? '' : 'none';
      }

      function renderSubTags() {
        subTagsBox.innerHTML = '';
        const subs = state.activeTag ? subFolders(state.activeTag) : [];
        if (subs.length === 0) {
          subRow.classList.remove('open');
          return;
        }
        subs.forEach(sub => {
          const btn = document.createElement('button');
          btn.className = 'mn-tag sub' + (state.activeSub === sub ? ' active' : '');
          btn.innerText = sub.title;
          btn.onclick = () => {
            state.activeSub = state.activeSub === sub ? null : sub;
            renderSubTags();
            renderGrid();
          };
          subTagsBox.appendChild(btn);
        });
        subRow.classList.add('open');
      }

      // 二级标签
      subFolders(cat).forEach(folder => {
        const btn = document.createElement('button');
        btn.className = 'mn-tag';
        btn.innerText = folder.title;
        btn.onclick = () => {
          if (state.activeTag === folder) {
            state.activeTag = null;
            state.activeSub = null;
          } else {
            state.activeTag = folder;
            state.activeSub = null;
          }
          tagsBox.querySelectorAll('.mn-tag').forEach(t => t.classList.remove('active'));
          if (state.activeTag) btn.classList.add('active');
          renderSubTags();
          renderGrid();
        };
        tagsBox.appendChild(btn);
      });

      renderGrid();
      return section;
    }

    /* ================= 滚动联动高亮 ================= */
    function initSectionObserver() {
      if (sectionObserver) sectionObserver.disconnect();
      sectionObserver = new IntersectionObserver(entries => {
        if (currentPage !== 'home') return;
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const index = parseInt(entry.target.id.replace('cat-', ''), 10);
            if (!isNaN(index)) highlightNav(index);
          }
        });
      }, { rootMargin: '-30% 0px -60% 0px' });

      document.querySelectorAll('.mn-section').forEach(s => sectionObserver.observe(s));
    }

    /* ================= 详情页：递归展开 + 定位最低一级 ================= */
    function showDetail(path) {
      currentPage = 'detail';
      closeMobileMenu();

      const container = document.getElementById('bookmarks');
      container.innerHTML = '';
      if (sectionObserver) sectionObserver.disconnect();

      // 面包屑
      const crumbs = document.getElementById('breadcrumbs');
      crumbs.style.display = 'flex';
      const crumbsPath = document.getElementById('breadcrumbs-path');
      crumbsPath.innerHTML = '';

      const homeCrumb = document.createElement('span');
      homeCrumb.className = 'cursor-pointer hover:underline';
      homeCrumb.innerText = '首页';
      homeCrumb.onclick = goHome;
      crumbsPath.appendChild(homeCrumb);

      path.forEach((node, idx) => {
        const sep = document.createElement('span');
        sep.innerText = ' > ';
        crumbsPath.appendChild(sep);

        const crumb = document.createElement('span');
        crumb.className = idx === path.length - 1
          ? 'text-gray-700 dark:text-gray-300 font-medium'
          : 'cursor-pointer hover:underline';
        crumb.innerText = node.title;
        if (idx < path.length - 1) {
          crumb.onclick = () => showDetail(path.slice(0, idx + 1));
        }
        crumbsPath.appendChild(crumb);
      });

      const backBtn = document.getElementById('back-home-button');
      backBtn.classList.remove('hidden');
      backBtn.onclick = goHome;

      // 标题
      const node = path[path.length - 1];
      const titleBar = document.createElement('div');
      titleBar.className = 'mn-detail-titlebar';
      titleBar.innerHTML = `<h2 class="mn-detail-title"></h2><span class="mn-section-count">${collectLinks(node).length} 个网站</span>`;
      titleBar.querySelector('.mn-detail-title').innerText = node.title;
      container.appendChild(titleBar);

      // 递归分组渲染，并记录最深的分组标题
      let deepest = { el: null, depth: -1 };

      function renderFolder(folder, parent, depth, labelPath) {
        const direct = (folder.children || []).filter(c => c.type === 'link');
        const subs = subFolders(folder);

        let target = parent;
        if (depth > 0) {
          const group = document.createElement('div');
          group.className = 'mn-group';

          const groupTitle = document.createElement('h3');
          groupTitle.className = 'mn-group-title';
          groupTitle.innerText = labelPath.join(' › ');
          group.appendChild(groupTitle);

          if (depth > deepest.depth) { deepest = { el: groupTitle, depth }; }
          group.dataset.depth = depth;

          const groupGrid = document.createElement('div');
          groupGrid.className = 'mn-grid';
          group.appendChild(groupGrid);

          parent.appendChild(group);
          target = groupGrid;
        } else if (direct.length > 0) {
          const topGrid = document.createElement('div');
          topGrid.className = 'mn-grid';
          topGrid.style.marginBottom = '1.5rem';
          parent.appendChild(topGrid);
          target = topGrid;
        }

        direct.forEach(l => target.appendChild(createSiteCard(l)));

        subs.forEach(sub => {
          renderFolder(sub, parent, depth + 1, labelPath.concat(sub.title));
        });
      }

      renderFolder(node, container, 0, [node.title]);

      // 定位到最低一级分组
      window.scrollTo({ top: 0 });
      if (deepest.el) {
        setTimeout(() => {
          deepest.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 150);
      }

      // 侧边栏高亮该一级分类
      const catIndex = topLevelData.findIndex(c => c.title === path[0].title);
      if (catIndex >= 0) highlightNav(catIndex);
    }

    /* ================= 搜索（沿用原逻辑） ================= */
    function searchInData(data, query) {
      let results = [];
      data.forEach(item => {
        if (item.title && item.title.toLowerCase().includes(query)) {
          results.push(item);
        }
        if (item.children) {
          results = results.concat(searchInData(item.children, query));
        }
      });
      return results;
    }

    function searchBookmarks(query) {
      if (!topLevelData || !query.trim()) return;
      currentPage = 'search';
      if (sectionObserver) sectionObserver.disconnect();
      closeMobileMenu();

      // 同步两端搜索框内容
      document.getElementById('searchInput').value = query;
      document.getElementById('searchInputMobile').value = query;

      const results = searchInData(topLevelData, query.toLowerCase());
      const links = results.filter(r => r.type === 'link');

      const container = document.getElementById('bookmarks');
      container.innerHTML = '';
      document.getElementById('breadcrumbs').style.display = 'none';
      document.getElementById('back-home-button').classList.add('hidden');
      document.getElementById('clearSearchButton').classList.remove('hidden');
      document.getElementById('clearSearchButtonMobile').classList.remove('hidden');
      highlightNav(-1);

      if (links.length === 0) {
        showNoResultsMessage();
        return;
      }

      const titleBar = document.createElement('div');
      titleBar.className = 'mn-detail-titlebar';
      titleBar.innerHTML = `<h2 class="mn-detail-title">搜索 “${query}”</h2><span class="mn-section-count">${links.length} 个结果</span>`;
      container.appendChild(titleBar);

      const grid = document.createElement('div');
      grid.className = 'mn-grid';
      links.forEach(l => grid.appendChild(createSiteCard(l)));
      container.appendChild(grid);
    }

    function clearSearchResults() {
      document.getElementById('searchInput').value = '';
      document.getElementById('searchInputMobile').value = '';
      document.getElementById('clearSearchButton').classList.add('hidden');
      document.getElementById('clearSearchButtonMobile').classList.add('hidden');
      renderHome();
      window.scrollTo({ top: 0 });
    }

    function showNoResultsMessage() {
      const container = document.getElementById('bookmarks');
      const messageContainer = document.createElement('div');
      messageContainer.className = 'flex flex-col items-center justify-center py-20';

      messageContainer.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-400 dark:text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z"/>
        </svg>
        <h2 class="text-gray-500 dark:text-gray-400 text-xl font-semibold mt-4">没有找到相关网站</h2>
        <p class="text-gray-400 dark:text-gray-500 mt-2 text-sm">换个关键词试试，或浏览左侧分类发现更多好东西！</p>`;
      container.appendChild(messageContainer);
    }

    /* ================= 移动端菜单 ================= */
    const offCanvasMenu = document.getElementById('off-canvas-menu');
    const offCanvasBackdrop = document.getElementById('off-canvas-backdrop');
    const offCanvasContent = document.getElementById('off-canvas-content');

    function openSidebar() {
      offCanvasMenu.classList.remove('hidden');
      setTimeout(() => {
        offCanvasBackdrop.classList.add('opacity-100');
        offCanvasContent.classList.add('translate-x-0');
      }, 10);
    }

    function closeSidebar() {
      offCanvasBackdrop.classList.remove('opacity-100');
      offCanvasContent.classList.remove('translate-x-0');
      setTimeout(() => {
        offCanvasMenu.classList.add('hidden');
      }, 300);
    }

    document.getElementById('open-sidebar-button').addEventListener('click', openSidebar);
    document.getElementById('close-sidebar-button').addEventListener('click', closeSidebar);
    offCanvasBackdrop.addEventListener('click', closeSidebar);

    /* ================= 搜索事件 ================= */
    document.getElementById('searchButton').addEventListener('click', () => {
      searchBookmarks(document.getElementById('searchInput').value);
    });
    document.getElementById('searchInput').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        searchBookmarks(event.target.value);
      }
    });
    document.getElementById('clearSearchButton').addEventListener('click', clearSearchResults);

    // 移动端搜索框（仅小屏可见）
    document.getElementById('searchInputMobile').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        searchBookmarks(event.target.value);
      }
    });
    document.getElementById('clearSearchButtonMobile').addEventListener('click', clearSearchResults);

    /* ================= 主题切换（沿用原逻辑） ================= */
    const themeToggleButton = document.getElementById('themeToggleButton');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function applyDarkTheme() {
      document.documentElement.classList.add('dark');
      sunIcon.classList.add('hidden');
      moonIcon.classList.remove('hidden');
    }

    function applyLightTheme() {
      document.documentElement.classList.remove('dark');
      sunIcon.classList.remove('hidden');
      moonIcon.classList.add('hidden');
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        applyLightTheme();
      } else {
        applyDarkTheme();
      }
    }

    themeToggleButton.addEventListener('click', toggleTheme);

    function applyColorTheme(theme) {
      if (theme === 'dark') applyDarkTheme();
      else applyLightTheme();
    }

    const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyColorTheme(prefersDarkTheme ? 'dark' : 'light');

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
      applyColorTheme(event.matches ? 'dark' : 'light');
    });

    /* ================= 数据加载（仅一次） ================= */
    document.addEventListener('DOMContentLoaded', () => {
      fetch('json/pintree.json')
        .then(response => response.json())
        .then(data => {
          document.getElementById('loading-spinner').style.display = 'none';
          topLevelData = data;

          buildSidebarNav();
          renderHome();

          // 恢复 hash 定位（如 #cat-2）
          const m = location.hash.match(/^#cat-(\d+)$/);
          if (m) {
            const idx = parseInt(m[1], 10);
            if (idx >= 0 && idx < topLevelData.length) {
              setTimeout(() => goToCategory(idx), 100);
            }
          }
        })
        .catch(error => {
          console.error('Error loading bookmarks:', error);
          document.getElementById('loading-spinner').style.display = 'none';
          document.getElementById('bookmarks').innerHTML =
            '<p class="text-center text-gray-500 py-20">数据加载失败，请确认通过本地 HTTP 服务（而非 file:// 直接双击）打开页面。</p>';
        });
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', (event) => {
      const yearElement = document.getElementById('currentYear');
      yearElement.textContent = new Date().getFullYear();
    });
  </script>

</body>
